<div class="text-input">
	@if (label()) {
		<label class="text-input-label" [for]="inputId()" [class.is-disabled]="isDisabled()">
			{{ label() }}

			<span [class.is-optional]="!isRequired()" [class.is-required]="isRequired()">
				{{ requirementLabel() }}
			</span>
		</label>
	}

	<div class="text-input-wrapper">
		@if (leftIcon()) {
			<div class="text-input-left-icon">
				<ng-container *ngComponentOutlet="leftIcon(); inputs: leftIconInputs()" />
			</div>
		}

		<input
			[value]="value()"
			[id]="inputId()"
			[name]="name()"
			[placeholder]="placeholder()"
			[type]="type()"
			[disabled]="isDisabled()"
			[autocomplete]="autocomplete()"
			[class.with-left-icon]="hasLeftIcon()"
			[class.with-right-icon]="hasRightIcon()"
			[class.valid]="isValid()"
			[class.error]="hasError()"
			[aria-disabled]="isDisabled()"
			[aria-invalid]="hasError()"
			(input)="valueChanged.emit($event)"
			(blur)="blurred.emit($event)"
			(keydown)="keyDown.emit($event)"
			(copy)="onCopy($event)"
			(cut)="onCut($event)"
			(paste)="onPaste($event)"
		/>

		@if (rightIcon()) {
			@if (isRightIconClickable()) {
				<button type="button" class="text-input-right-icon" (click)="rightIconClicked.emit($event)">
					<ng-container *ngComponentOutlet="rightIcon(); inputs: rightIconInputs" />
				</button>
			} @else {
				<div class="text-input-right-icon">
					<ng-container *ngComponentOutlet="rightIcon(); inputs: rightIconInputs" />
				</div>
			}
		}
	</div>

	@if (hasError()) {
		<div class="text-input-error">
			<ctf-icon-exclamation-mark [width]="13" [height]="13" />

			<span class="text-input-error-message">{{ errorMessage() }}</span>
		</div>
	}
</div>
